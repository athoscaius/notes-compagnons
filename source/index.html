<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'"><title>Notes</title><link rel="stylesheet" href="editor.css"></head><body>
<header><div class="brand"><button id="archive-toggle" class="icon" aria-label="Ouvrir les archives" title="Archives (⌘⇧A)" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M5.8 8h.4m-.4 4h.4m-.4 4h.4"/></svg></button><span class="brand-name">Notes</span></div><div class="header-actions"><button id="new-note" title="Nouvelle note (⌘N)"><span class="plus">＋</span> Nouvelle note</button><button id="export" class="primary"><svg viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M5 14v6h14v-6"/></svg>Exporter</button></div></header>
<main><aside id="sidebar" aria-label="Archives datées" hidden><div class="sidebar-top"><span id="archive-title">ARCHIVES</span><span id="note-count"></span><button id="empty-trash" hidden>Vider</button></div><div id="archive-list"></div><div class="sidebar-foot"><button id="trash-toggle" aria-pressed="false">Corbeille <span id="trash-count">0</span></button><span>Conservées un mois sur ce Mac.</span></div></aside><section class="workspace"><div class="format-bar" role="toolbar" aria-label="Mise en forme"><div class="format-group"><button id="bold" class="tool bold" title="Gras (⌘B)" aria-label="Gras" aria-pressed="false">B</button><button id="bullet" class="tool" title="Liste à puces" aria-label="Liste à puces"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg></button><div class="table-control"><button id="table" class="tool" title="Insérer un tableau" aria-label="Insérer un tableau" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16"/></svg></button><div id="table-picker" class="popover" hidden><div id="grid-label">1 colonne × 1 ligne</div><div id="table-grid" role="group" aria-label="Dimensions du tableau"></div><div class="table-numbers"><label>Colonnes<input id="table-cols" type="number" min="1" max="12" value="2"></label><label>Lignes<input id="table-rows" type="number" min="1" max="50" value="3"></label></div><button id="insert-table" class="primary">Insérer le tableau</button></div></div></div><span class="toolbar-divider"></span><div class="format-group headings"><button class="tool" data-heading="0" title="Texte normal">Texte</button><button class="tool" data-heading="1" title="Titre 1 · visible dans la note et à l’export">T1</button><button class="tool" data-heading="2" title="Titre 2 · visible dans la note et à l’export">T2</button><button class="tool" data-heading="3" title="Titre 3 · visible dans la note et à l’export">T3</button></div><span class="format-spacer"></span><span class="plain-indicator">Collage nettoyé</span></div>
<div class="editor-scroll"><article id="editor" contenteditable="true" role="textbox" aria-label="Votre note" aria-multiline="true" spellcheck="true" data-placeholder="Écrivez, collez, c’est noté."><p><br></p></article></div><footer><span id="save-status" role="status">Prête à écrire</span><span id="word-count">0 mot</span></footer></section></main>
<script src="editor.js"></script></body></html>
